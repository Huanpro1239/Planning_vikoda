name: Planning Dry Run Review

on:
  push:
    branches:
      - review-followup-26c
    paths:
      - dry_run_ready.txt

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: review-followup-26c

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full read-only planning dry-run
        run: python -X utf8 dry_run_planning.py

      - name: Review RGB stockout tradeoffs
        run: python -X utf8 review_rgb_service.py

      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vikoda-planning-dry-run
          path: dry_run_artifacts/
          if-no-files-found: error
          retention-days: 7
