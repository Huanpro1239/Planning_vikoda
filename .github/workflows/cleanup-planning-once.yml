name: Verify Ke hoach SX Cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-planning-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Ke_hoach_SX has no formulas
        run: |
          python - <<'PY'
          import zipfile
          from io import BytesIO
          from lxml import etree
          from planning_cleanup import _find_sheet_xml_path
          from sync_stock import DEST_PATH, GraphClient, get_access_token

          graph = GraphClient(get_access_token())
          site_id = graph.get_site_id()
          drive_id = graph.get_default_drive_id(site_id)
          item = graph.get_item_by_path(drive_id, DEST_PATH)
          data = graph.download_file(drive_id, item['id'])

          with zipfile.ZipFile(BytesIO(data), 'r') as archive:
              path = _find_sheet_xml_path(archive, 'Ke_hoach_SX')
              root = etree.fromstring(archive.read(path))
              count = len(root.xpath('//*[local-name()="f"]'))

          print(f'KE_HOACH_SX_FORMULAS={count}')
          if count != 0:
              raise SystemExit(f'Expected 0 formulas, found {count}')
          PY
