name: Cleanup Ke hoach SX Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-planning-once.yml

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inspect workbook sheet names
        run: |
          python - <<'PY'
          from io import BytesIO
          import zipfile
          from lxml import etree
          from sync_stock import DEST_PATH, GraphClient, get_access_token

          graph = GraphClient(get_access_token())
          site_id = graph.get_site_id()
          drive_id = graph.get_default_drive_id(site_id)
          item = graph.get_item_by_path(drive_id, DEST_PATH)
          data = graph.download_file(drive_id, item['id'])

          with zipfile.ZipFile(BytesIO(data), 'r') as archive:
              root = etree.fromstring(archive.read('xl/workbook.xml'))
              names = [sheet.get('name') for sheet in root.xpath('//*[local-name()="sheet"]')]

          print('WORKBOOK_SHEETS=' + repr(names))
          PY
