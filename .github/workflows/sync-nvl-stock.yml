name: Sync SharePoint NVL Stock

on:
  schedule:
    # 06:15 AM VN (UTC+7) = 23:15 UTC ngày trước.
    # Chạy sau workflow Planning 15 phút để giảm tải đồng thời lên Microsoft Graph.
    - cron: "15 23 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish workbook Kế hoạch mua hàng.xlsx chính thức sau khi proposal đã được review"
        required: true
        type: boolean
        default: false
      config_file:
        description: "File cấu hình NVL sử dụng (mặc định nvl_stock_config.json, có thể chọn nvl_stock_staging_config.json)"
        required: false
        type: string
        default: "nvl_stock_config.json"
      ensure_staging_copy:
        description: "Chỉ kiểm tra hoặc tạo bản sao staging Test_Ke_hoach_mua_hang_copy.xlsx trên SharePoint (không ghi đè)"
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types:
      - sharepoint_nvl_updated
      - nvl_stock_updated
      - nvl_open_po_updated

permissions:
  contents: write
  id-token: write

concurrency:
  group: sharepoint-nvl-stock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_AUTH_MODE: ${{ vars.MS_AUTH_MODE || 'oidc' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NVL production readiness gate
        run: python -X utf8 scripts/nvl_production_readiness.py

      - name: Checkout runtime state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.ensure_staging_copy) && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
        uses: actions/checkout@v5
        with:
          ref: runtime-state
          path: .runtime-state

      - name: Clean test artifacts from workspace
        run: |
          rm -f nvl_stock_proposal.xlsx nvl_stock_report.json nvl_release_manifest.json audit_summary.json staging_copy_info.json official_backup_* official_target_backup_info.json nvl_open_po_proposal.xlsx nvl_open_po_report.json

      - name: Ensure staging copy on SharePoint
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ensure_staging_copy }}
        shell: bash
        run: |
          echo "[AUTH] Microsoft Graph auth mode: $MS_AUTH_MODE"
          python -X utf8 scripts/ensure_staging_copy.py

      - name: Generate NVL proposal or controlled publish
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.ensure_staging_copy) }}
        shell: bash
        env:
          # Schedule/repository_dispatch là luồng tự động production; workflow_dispatch
          # vẫn mặc định proposal-only trừ khi người dùng bật publish=true.
          REQUEST_PUBLISH: ${{ (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && 'true' || 'false' }}
          CONFIG_FILE: ${{ (github.event_name == 'workflow_dispatch' && inputs.config_file) || 'nvl_stock_config.json' }}
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_ACTION: ${{ github.event.action }}
        run: |
          echo "[NVL] trigger event=$TRIGGER_EVENT action=$TRIGGER_ACTION publish=$REQUEST_PUBLISH config=$CONFIG_FILE"
          echo "[AUTH] Microsoft Graph auth mode: $MS_AUTH_MODE"

          if [[ "$REQUEST_PUBLISH" == "true" ]]; then
            python -X utf8 -m nvl.stock --config "$CONFIG_FILE" --publish
            python -X utf8 -m nvl.open_po_safe --target-config "$CONFIG_FILE" --publish
          else
            python -X utf8 scripts/survey_nvl_sharepoint.py --config "$CONFIG_FILE"
            python -X utf8 -m nvl.open_po_safe --target-config "$CONFIG_FILE"
          fi

      - name: Refresh NVL release history
        if: ${{ success() && !(github.event_name == 'workflow_dispatch' && inputs.ensure_staging_copy) && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
        run: git -C .runtime-state pull --rebase origin runtime-state

      - name: Record NVL release manifest
        if: ${{ success() && !(github.event_name == 'workflow_dispatch' && inputs.ensure_staging_copy) && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
        env:
          NVL_REQUIRE_READINESS: "1"
        run: |
          python -X utf8 -m nvl.release \
            --previous-manifest .runtime-state/nvl/latest_release.json

      - name: Save NVL release history to runtime-state branch
        if: ${{ success() && !(github.event_name == 'workflow_dispatch' && inputs.ensure_staging_copy) && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
        shell: bash
        run: |
          test -f nvl_release_manifest.json
          RELEASE_ID="$(python -c 'import json; from pathlib import Path; manifest=json.loads(Path("nvl_release_manifest.json").read_text(encoding="utf-8")); release_id=str(manifest.get("release_id") or "").strip(); assert release_id, "release_id missing"; print(release_id)')"

          mkdir -p .runtime-state/nvl/releases
          cp nvl_release_manifest.json .runtime-state/nvl/latest_release.json
          cp nvl_release_manifest.json ".runtime-state/nvl/releases/${RELEASE_ID}.json"

          python -X utf8 scripts/audit_nvl_releases.py \
            .runtime-state/nvl/releases \
            --latest .runtime-state/nvl/latest_release.json \
            --out-json .runtime-state/nvl/release_index.json \
            --out-csv .runtime-state/nvl/release_index.csv \
            --no-git

          cd .runtime-state

          if [[ -z "$(git status --porcelain -- nvl/latest_release.json nvl/releases nvl/release_index.json nvl/release_index.csv)" ]]; then
            echo "[NVL-RELEASE] Không có thay đổi release history."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add nvl/latest_release.json nvl/releases nvl/release_index.json nvl/release_index.csv
          git commit -m "chore: record NVL release ${RELEASE_ID}"
          git pull --rebase origin runtime-state
          git push origin HEAD:runtime-state

      - name: Upload NVL proposal and report audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nvl-audit-${{ github.run_id }}
          path: |
            nvl_stock_proposal.xlsx
            nvl_stock_report.json
            nvl_open_po_proposal.xlsx
            nvl_open_po_report.json
            nvl_release_manifest.json
            nvl_production_readiness_report.json
            .runtime-state/nvl/release_index.json
            .runtime-state/nvl/release_index.csv
            audit_summary.json
            staging_copy_info.json
            official_backup_*
            official_target_backup_info.json
          if-no-files-found: warn
          retention-days: 14
