name: Sync NXT Ke Toan Tong Hop

# Dựng lại "Planning App/Clean Data/Data NXT ke toan/Tong_Hop_NXT_Ke_Toan.xlsx"
# từ "Planning App/Bao cao ton kho/Ton ke toan/<Vikoda|VKD>" + "Bao cao xuat kho" (tồn ký gửi) + Danh mục.
# Lịch 15 phút (lệch 11 phút so với Sell In), chỉ dựng lại khi nguồn thay đổi.

on:
  repository_dispatch:
    types:
      - sharepoint_nxt_ke_toan_updated
  schedule:
    # Kiểm tra mỗi 15 phút; chỉ dựng lại khi NXT / Xuất kho / Danh mục thay đổi
    - cron: "11-59/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sharepoint-nxt-ke-toan
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_AUTH_MODE: ${{ vars.MS_AUTH_MODE || 'oidc' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rebuild Tong_Hop_NXT_Ke_Toan.xlsx
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            python -X utf8 -m nxt_ke_toan --if-changed
          else
            python -X utf8 -m nxt_ke_toan
          fi
