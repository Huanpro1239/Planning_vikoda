name: Apply Review Fixes

on:
  push:
    paths:
      - review_fix_payload.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract reviewed fixes
        run: |
          base64 -d review_fix_payload.b64 > /tmp/review_fix_payload.tar.gz
          tar -xzf /tmp/review_fix_payload.tar.gz

      - name: Run full regression suite
        run: python -X utf8 -m unittest discover -s tests

      - name: Commit reviewed fixes and remove one-shot files
        shell: bash
        run: |
          git rm review_fix_payload.b64 .github/workflows/apply-review-fixes.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: address confirmed planning review defects"
          git push
