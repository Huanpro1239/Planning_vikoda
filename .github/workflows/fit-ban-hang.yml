name: FIT Ban Hang NPP

# Lấy FIT "ĐH Bán trong kỳ NPP" (Mức lấy Đơn hàng + Hóa Đơn) qua Worker erp-nhan-hang
# (giữ phiên FIT, không cần CAPTCHA khi phiên còn hạn) rồi ghi đè lên SharePoint:
#   BCDonHangBanTrongKyNPP.xlsm, Lay So Hoa don.xlsm
# Kích hoạt: lệnh Telegram /banhang [kỳ] (Worker gửi repository_dispatch fit_ban_hang),
# chạy tay, hoặc lịch sáng 07:05 giờ VN (đầu tháng -> hôm nay).

on:
  repository_dispatch:
    types:
      - fit_ban_hang
  workflow_dispatch:
    inputs:
      ky:
        description: 'Kỳ: để trống = đầu tháng→hôm nay | thangtruoc | 10/2026 | 01/10/2026 15/10/2026'
        required: false
        default: ''
  schedule:
    - cron: "5 0 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: fit-ban-hang
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_AUTH_MODE: ${{ vars.MS_AUTH_MODE || 'oidc' }}
      FIT_CF_ACCESS_CLIENT_ID: ${{ secrets.FIT_CF_ACCESS_CLIENT_ID }}
      FIT_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FIT_CF_ACCESS_CLIENT_SECRET }}
      FIT_SP_FOLDER: ${{ vars.FIT_SP_FOLDER }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KY: ${{ github.event.inputs.ky }}
      START: ${{ github.event.client_payload.start }}
      END: ${{ github.event.client_payload.end }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lay bao cao va ghi SharePoint
        run: |
          if [[ -n "$START" ]]; then
            python -X utf8 -m fit_ban_hang --start "$START" --end "$END"
          else
            python -X utf8 -m fit_ban_hang --ky "$KY"
          fi
