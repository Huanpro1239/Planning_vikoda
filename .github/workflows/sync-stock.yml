name: Sync SharePoint Stock

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - sharepoint_stock_updated

permissions:
  contents: write

concurrency:
  group: sharepoint-stock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync stock to SharePoint
        run: python sync_stock_compat.py

      - name: Sync FC to Ke hoach SX
        run: python sync_planning_fc_compat.py

      - name: Generate Ke hoach SX date headers
        run: python sync_planning_calendar.py

      - name: Calculate Ke hoach SX M to R directly
        run: python sync_planning_metrics_direct.py

      - name: Schedule daily production S onward
        run: python sync_planning_schedule.py

      - name: Remove remaining Ke hoach SX formulas
        run: python cleanup_planning.py

      - name: Save sync states
        shell: bash
        run: |
          if git diff --quiet -- state.json planning_runtime.json; then
            echo "Các file state không thay đổi."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json planning_runtime.json
          git commit -m "chore: update SharePoint sync states"
          git push
