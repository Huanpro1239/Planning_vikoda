name: Sync SharePoint Stock

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - sharepoint_stock_updated

permissions:
  contents: write

concurrency:
  group: sharepoint-stock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run single-snapshot validated planning pipeline
        run: python -X utf8 sync_planning_pipeline.py

      - name: Upload planning audit report
        uses: actions/upload-artifact@v4
        with:
          name: planning-audit-${{ github.run_id }}
          path: |
            planning_schedule_report.json
            planning_input_revision.json
          if-no-files-found: error
          retention-days: 14

      - name: Save sync states
        shell: bash
        run: |
          if git diff --quiet -- state.json planning_runtime.json; then
            echo "Các file state không thay đổi."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json planning_runtime.json
          git commit -m "chore: update SharePoint sync states"
          git push
