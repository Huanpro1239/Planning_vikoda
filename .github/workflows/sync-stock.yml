name: Sync SharePoint Stock

on:
  schedule:
    # 06:00 AM VN (UTC+7) = 23:00 UTC hàng ngày
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish workbook chính thức sau khi proposal đã được review"
        required: true
        type: boolean
        default: false
      approval_proposal_id:
        description: "Bắt buộc khi proposal đang review_required"
        required: false
        type: string
      approval_reason:
        description: "Lý do chấp nhận review_required/shortage; bắt buộc khi review_required"
        required: false
        type: string
  repository_dispatch:
    types:
      - sharepoint_stock_updated

permissions:
  contents: write

concurrency:
  group: sharepoint-stock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite gate
        run: |
          python -X utf8 -m unittest discover -s tests -v

      - name: Generate proposal or controlled publish
        shell: bash
        env:
          REQUEST_PUBLISH: ${{ (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && 'true' || 'false' }}
          APPROVAL_PROPOSAL_ID: ${{ inputs.approval_proposal_id }}
          APPROVAL_REASON: ${{ inputs.approval_reason }}
          APPROVED_BY: ${{ github.event_name == 'schedule' && 'daily-schedule' || (github.event_name == 'repository_dispatch' && 'power-automate' || github.actor) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          EXTRA_FLAGS=""
          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            EXTRA_FLAGS="--skip-if-unchanged"
          elif [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            EXTRA_FLAGS="--force"
          fi

          if [[ "$REQUEST_PUBLISH" == "true" ]]; then
            python -X utf8 sync_planning_pipeline.py \
              --publish \
              --approval-proposal-id "$APPROVAL_PROPOSAL_ID" \
              --approval-reason "$APPROVAL_REASON" \
              --approved-by "$APPROVED_BY" \
              $EXTRA_FLAGS
          else
            python -X utf8 sync_planning_pipeline.py --approved-by "$APPROVED_BY" $EXTRA_FLAGS
          fi

      - name: Survey and dry-run NVL stock
        shell: bash
        run: |
          python -X utf8 scripts/survey_nvl_sharepoint.py

      - name: Upload planning proposal and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planning-audit-${{ github.run_id }}
          path: |
            planning_proposal.xlsx
            planning_schedule_report.json
            planning_input_revision.json
            planning_publish_decision.json
            nvl_stock_proposal.xlsx
            nvl_stock_report.json
            dry_run_artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Save sync states after authorized publish
        if: ${{ success() && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
        shell: bash
        run: |
          if git diff --quiet -- state.json planning_runtime.json; then
            echo "Các file state không thay đổi."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json planning_runtime.json
          git commit -m "chore: update SharePoint sync states"
          git pull --rebase origin main
          git push
