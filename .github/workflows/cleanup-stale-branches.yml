name: Cleanup stale branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ contains(github.event.head_commit.message, '[branch-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete verified stale branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          protected_branches=("main" "runtime-state")
          stale_branches=(
            "chore/cleanup-pr44-branch"
            "refactor/planning-weekly-model"
            "chore/cleanup-pr42-branch"
            "refactor/planning-weekly-engine"
            "fix/cleanup-stale-branches-rest"
            "chore/cleanup-stale-branches"
            "chore/node24-actions"
            "chore/oidc-cutover-node24"
            "chore/runtime-state-branch-protection"
            "feat/entra-oidc"
            "feat/nvl-auto-sync"
            "feat/nvl-open-po-column-e"
            "feat/sync-nvl-stock"
            "fix/khsx-ki-layout-and-engine-v4"
            "fix/khsx-ki-layout-detect"
            "fix/khsx-ki-layout-sku-scoping"
            "fix/nvl-open-po-graph-500"
            "fix/nvl-source-identity"
            "fix/nvl-source-share-url"
            "refactor/nvl-modularize-and-resource-cleanup"
            "refactor/package-layout"
            "refactor/planning-modularization"
            "refactor/remove-legacy-shims"
            "refactor/repo-hygiene-cleanup"
            "refactor/sharepoint-canonical-client"
            "refactor/sharepoint-client"
            "tmp-noop"
          )

          for branch in "${stale_branches[@]}"; do
            for protected in "${protected_branches[@]}"; do
              if [[ "$branch" == "$protected" ]]; then
                echo "Refusing to delete protected branch: $branch"
                exit 1
              fi
            done
          done

          for branch in "${stale_branches[@]}"; do
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              echo "Deleting $branch"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            else
              echo "Already absent: $branch"
            fi
          done

          echo "Verified stale branch cleanup completed."
